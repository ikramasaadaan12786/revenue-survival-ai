name: 24/7 Follow-up & Pipeline Engine

on:
  schedule:
    # Runs every 15 minutes with offset at 7, 22, 37, 52
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'Target Mission ID'
        required: false
        default: '1'

concurrency:
  group: revenue-pipeline-cadence
  cancel-in-progress: false

jobs:
  pipeline-and-followups:
    name: Follow-ups & 9-Stage Pipeline Engine
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Evaluate Due Follow-ups
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENVIRONMENT: production
          ACTIVE_MISSION_ID: ${{ github.event.inputs.mission_id || '' }}
          WORKER_INSTANCE_ID: GITHUB-ACTIONS-PIPELINE-ENGINE
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          python run_cloud_task.py followups

      - name: Advance Pipeline & Closing Assistant
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENVIRONMENT: production
          ACTIVE_MISSION_ID: ${{ github.event.inputs.mission_id || '' }}
          WORKER_INSTANCE_ID: GITHUB-ACTIONS-PIPELINE-ENGINE
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          python run_cloud_task.py mission_pipeline
